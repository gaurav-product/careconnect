name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit and integration tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (phone, tablet, desktop)
        run: npm run test:e2e

      - name: Accessibility sweep
        run: |
          npm run reset-demo
          NODE_ENV=production PORT=4000 JWT_SECRET=ci-secret-key npx tsx app/server/index.ts &
          npx wait-on http://127.0.0.1:4000/api/health -t 30000
          npm run audit:a11y

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
